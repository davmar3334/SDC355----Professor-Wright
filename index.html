<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!--
Author: Dave Martinez
Date: 1NOV26
Purpose: A simple web page that demonstrates persistent storage 
with a welcome modal on load, a tooltip on the contact form submit 
button, and a dark mode toggle that saves the user’s preference in 
localStorage so it remains active across visits.
-->
    <title>Persistent Storage Project</title>
    <style>
        /* Basic page styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #ffffff;
            color: #333333;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            background-color: #1e1e1e;
            color: #f0f0f0;
        }

        h1 {
            margin-top: 0;
        }

        /* Dark mode toggle */
        .toggle-container {
            margin: 20px 0;
        }

        /* Contact form */
        form {
            max-width: 400px;
            margin-top: 30px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        /* Tooltip styles */
        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 180px;
            background-color: #555;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -90px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* slight transparency */
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode .modal {
            background-color: #2d2d2d;
            color: #f0f0f0;
        }

        .modal button {
            margin-top: 15px;
            padding: 8px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Dark Mode Toggle -->
    <div class="toggle-container">
        <label>
            <input type="checkbox" id="darkModeToggle">
            Dark Mode
        </label>
    </div>

    <h1>Welcome to My Page</h1>
    <p>This is a sample page demonstrating persistent storage features.</p>

    <!-- Contact Form -->
    <form id="contactForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <!-- Submit button with tooltip -->
        <div class="tooltip">
            <button type="submit">Submit</button>
            <span class="tooltiptext">Click to send your message!</span>
        </div>
    </form>

    <!-- Welcome Modal -->
    <div id="welcomeModal" class="modal-overlay">
        <div class="modal">
            <h2>Welcome</h2>
            <p>This page is a work in progress.</p>
            <button id="closeModal">Close</button>
        </div>
    </div>

    <script>
        // ========== Modal Logic ==========
        // Show the modal when the page loads
        window.addEventListener("load", function () {
            document.getElementById("welcomeModal").style.display = "flex";
        });

        // Close button hides the modal
        document.getElementById("closeModal").addEventListener("click", function () {
            document.getElementById("welcomeModal").style.display = "none";
        });

        // ========== Dark Mode Persistence ==========
        const darkModeToggle = document.getElementById("darkModeToggle");
        const body = document.body;

        // Check localStorage on page load and apply saved preference
        if (localStorage.getItem("darkMode") === "enabled") {
            body.classList.add("dark-mode");
            darkModeToggle.checked = true;
        }

        // Listen for toggle changes and save preference
        darkModeToggle.addEventListener("change", function () {
            if (this.checked) {
                body.classList.add("dark-mode");
                localStorage.setItem("darkMode", "enabled");
            } else {
                body.classList.remove("dark-mode");
                localStorage.setItem("darkMode", "disabled");
            }
        });

        // Prevent form from actually submitting (demo only)
        document.getElementById("contactForm").addEventListener("submit", function (e) {
            e.preventDefault();
            alert("Message sent! (demo)");
        });
    </script>
</body>
</html>
